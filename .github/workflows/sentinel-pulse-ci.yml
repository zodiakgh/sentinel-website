name: Sentinel Pulse CI

on:
  push:
    branches:
      - pulse-foundation
    paths:
      - "pulse/**"
  pull_request:
    paths:
      - "pulse/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulse/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
