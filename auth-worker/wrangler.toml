name = "sentinel-website"
# Keeps secrets/variables added in the Cloudflare dashboard when Git deploys the Worker.
keep_vars = true
main = "index.js"
compatibility_date = "2024-11-01"

# Serve the Worker on a subdomain of your site so the session cookie is first-party
# (same registrable domain). The domain must be managed by Cloudflare DNS.
routes = [{ pattern = "api.sentineldashboard.site", custom_domain = true }]

[triggers]
crons = ["*/5 * * * *"]

[vars]
DISCORD_CLIENT_ID = "1545465845524996219"
SITE_ORIGIN = "https://www.sentineldashboard.site"
API_ORIGIN = "https://api.sentineldashboard.site"
# TURNSTILE_SITE_KEY = "0x..."   # public site key, only if you enable the captcha

# Support form (POST /support/send) uses Resend; no Cloudflare Email Routing binding is required.
# Add SUPPORT_TO in the Cloudflare Worker variables as your actual inbox.
# SUPPORT_FROM is optional; use an address on the domain verified in Resend.
# Store RESEND_API_KEY as a Worker secret (never commit it to this file).
# SUPPORT_TO = "your-real-inbox@example.com"  # set this in Worker Settings → Variables
SUPPORT_FROM = "Sentinel Support <support@sentineldashboard.site>"
ACCOUNT_EMAIL_FROM = "Sentinel <noreply@sentineldashboard.site>"

# Create with: npx wrangler kv namespace create SESSIONS   then paste the id below
[[kv_namespaces]]
binding = "SESSIONS"
id = "f76238de8c62476b9184012ecadee81e"

# Secrets (never put these in this file):
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put STATE_SECRET        # any long random string
#   npx wrangler secret put BOT_TOKEN           # REQUIRED for server verification (gives the role); also lets the dashboard show where Sentinel is added
#   npx wrangler secret put BOT_API_KEY         # REQUIRED for server verification: a long random string, the same value as SENTINEL_API_KEY in the bot's env
#   npx wrangler secret put SERVERS_ADMIN_KEY   # server directory admin panel: a long random string, the same value as SERVERS_ADMIN_KEY in the bot's env
#   (also add the plain variable SERVERS_API_URL = https://servers-api.sentineldashboard.site in Worker Settings → Variables)
#   npx wrangler secret put TURNSTILE_SECRET    # OPTIONAL captcha on the verification page (also set the TURNSTILE_SITE_KEY variable below)

# Profile media uploads: create this R2 bucket once with `npx wrangler r2 bucket create sentinel-profile-assets`
[[r2_buckets]]
binding = "PROFILE_ASSETS"
bucket_name = "sentinel-profile-assets"
