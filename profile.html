<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090d17"><meta name="color-scheme" content="dark">
<title>Sentinel Profile</title><meta name="description" content="A public profile on Sentinel."><link rel="icon" href="/sentinel.png" type="image/png"><link rel="stylesheet" href="/assets/css/main.css">
<style>
:root{color-scheme:dark}.sp-page{min-height:100vh;position:relative;isolation:isolate;background:#090d17;overflow:hidden}.sp-bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.32;filter:saturate(.85)}.sp-wash{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#070a12a8,#070a12ed 70%)}.sp-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(1080px,calc(100% - 32px));margin:auto;padding:22px 0}.sp-nav .brand{font-size:18px}.sp-wrap{width:min(900px,calc(100% - 28px));margin:16px auto 80px}.sp-card{overflow:hidden;border:1px solid #ffffff20;border-radius:24px;background:#0b1020d9;box-shadow:0 30px 100px #0008;backdrop-filter:blur(18px)}.sp-banner{height:clamp(150px,26vw,260px);background:linear-gradient(135deg,#1a2440,#322251);background-size:cover;background-position:center}.sp-content{padding:0 clamp(18px,5vw,46px) 36px;text-align:center}.sp-avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#141d30;border:5px solid #0b1020;margin-top:-56px;position:relative;box-shadow:0 12px 32px #0008}.sp-name{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;margin:12px 0 3px;overflow-wrap:anywhere}.sp-handle{color:#98a6bf;font-size:14px}.sp-badges{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:14px 0}.sp-badge{border:1px solid #8b7cff55;background:#8b7cff18;color:#ddd7ff;border-radius:99px;padding:5px 9px;font-size:11px}.sp-bio{white-space:pre-wrap;overflow-wrap:anywhere;max-width:600px;margin:16px auto;color:#d1daea;line-height:1.75}.sp-status{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffffff20;background:#ffffff08;border-radius:99px;padding:8px 12px;font-size:13px;color:#d8e0ef}.sp-links{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:22px 0}.sp-link{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff08;color:#f2f4ff;text-decoration:none;transition:transform .18s,border-color .18s}.sp-link:hover{transform:translateY(-2px);border-color:var(--sp-accent)}.sp-widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0;text-align:left}.sp-widget{border:1px solid #ffffff1a;background:#ffffff07;border-radius:15px;padding:17px;min-width:0;overflow-wrap:anywhere}.sp-widget h3{font-size:15px;margin:0 0 8px}.sp-widget p{white-space:pre-wrap;color:#c0cbe0;font-size:14px;line-height:1.65;margin:0}.sp-widget a{display:inline-block;margin-top:10px;color:#d4cbff}.sp-music{margin:24px auto;max-width:560px;text-align:left}.sp-music h3{font-size:14px;color:#c9d4e8;margin:0 0 10px}.sp-music iframe{display:block;width:100%;border:0;border-radius:13px;min-height:152px;background:#111}.sp-foot{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px;color:#8190aa;font-size:12px}.sp-empty{text-align:center;padding:60px 24px}.sp-empty h1{font-size:32px}.sp-error{color:#ffb7c5}.sp-hidden{display:none!important}@media(max-width:600px){.sp-widgets{grid-template-columns:1fr}.sp-content{padding-bottom:26px}.sp-avatar{width:96px;height:96px;margin-top:-48px}}
</style>
</head>
<body><div class="sp-page" id="profile-page"><img class="sp-bg sp-hidden" id="sp-background" alt=""><div class="sp-wash"></div><header class="sp-nav"><a class="brand" href="/" aria-label="Sentinel"><span class="brand-mark">S</span><span class="brand-word">Sentinel</span></a><a class="btn btn-sm" href="/account">Create your profile</a></header><main class="sp-wrap"><section class="sp-card" id="sp-card"><div class="sp-empty" id="sp-loading"><p>Loading Sentinel profile…</p></div><div class="sp-empty sp-hidden" id="sp-not-found"><h1>Profile not found</h1><p class="sp-error">This profile doesn't exist or is not public.</p><a class="btn btn-primary" href="/account">Create your own profile</a></div><div id="sp-profile" class="sp-hidden"><div class="sp-banner" id="sp-banner"></div><div class="sp-content"><img class="sp-avatar" id="sp-avatar" alt="Profile avatar"><h1 class="sp-name" id="sp-name"></h1><div class="sp-handle" id="sp-handle"></div><div class="sp-badges" id="sp-badges"></div><p class="sp-bio" id="sp-bio"></p><div class="sp-status sp-hidden" id="sp-status"></div><div class="sp-links" id="sp-links"></div><div class="sp-widgets" id="sp-widgets"></div><div class="sp-music sp-hidden" id="sp-music"><h3>On repeat</h3><div id="sp-music-frame"></div></div><div class="sp-foot"><span id="sp-views">0 views</span><span>·</span><span>Made with <a href="/" style="color:var(--sp-accent)">Sentinel</a></span></div></div></div></section></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/profile.js"></script></body></html>
